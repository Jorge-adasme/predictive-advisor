[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-advisor"
version = "0.1.0"
description = "Analizador predictivo de inversiones orientado a Chile/BTG Pactual"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "yfinance>=0.2.50",
  "alpaca-py>=0.33.0",
  "scikit-learn>=1.5.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "rich>=13.9.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
advisor = "advisor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
