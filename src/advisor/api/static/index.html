<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Advisor Chile</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #e8eefc;
      --muted: #9db0d0;
      --accent: #3dd68c;
      --warn: #ffb020;
      --danger: #ff5d5d;
      --line: #243047;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #15233d, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: #9db0d0; font-size: 0.9rem; margin-bottom: 16px; }
    .card {
      background: rgba(18, 26, 43, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 600;
    }
    button {
      background: linear-gradient(135deg, #2f6bff, #3dd68c);
      color: #041018;
      flex: 1;
      min-width: 140px;
    }
    button.secondary { background: #243047; color: var(--text); }
    button:disabled { opacity: 0.6; }
    select { background: #1a2438; color: var(--text); border: 1px solid var(--line); }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #1d2a44;
    }
    .pill.buy { background: rgba(61, 214, 140, 0.2); color: var(--accent); }
    .pill.avoid { background: rgba(255, 93, 93, 0.15); color: var(--danger); }
    .pill.hold { background: rgba(255, 176, 32, 0.15); color: var(--warn); }
    .msg {
      padding: 10px 12px;
      border-radius: 12px;
      background: #1a2438;
      color: #d7e3ff;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .msg.warn { background: rgba(255, 176, 32, 0.12); color: #ffd28a; }
    .msg.ok { background: rgba(61, 214, 140, 0.12); color: #b6f5d2; }
    .ticker { font-size: 1.05rem; font-weight: 700; }
    .meta { color: #9db0d0; font-size: 0.85rem; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .stat {
      background: #0f1728;
      border-radius: 12px;
      padding: 10px;
    }
    .stat .k { color: #9db0d0; font-size: 0.75rem; }
    .stat .v { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    ul { margin: 8px 0 0; padding-left: 18px; color: #c9d7f2; }
    .footer { color: #7f92b3; font-size: 0.75rem; margin-top: 18px; line-height: 1.4; }
    .loading { text-align: center; padding: 24px; color: #9db0d0; }
  </style>
</head>
<body>
  <h1>Advisor Chile</h1>
  <div class="sub">Análisis predictivo · BTG-ready · uso desde iPhone</div>

  <div class="card">
    <div class="row">
      <select id="topN">
        <option value="5">Top 5</option>
        <option value="8" selected>Top 8</option>
        <option value="12">Top 12</option>
      </select>
      <button id="runBtn" onclick="runAnalyze()">Analizar</button>
      <button id="autoBtn" class="secondary" onclick="runAutopilot()">Auto Alpaca</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="secondary" onclick="loadPortfolio()">Ver portafolio</button>
      <button class="secondary" onclick="haltBot()">Kill-switch</button>
      <button class="secondary" onclick="resumeBot()">Reanudar</button>
      <button class="secondary" onclick="liveStatus()">Estado Live BTG</button>
    </div>
  </div>

  <div id="status" class="msg">Autopilot Alpaca: opera solo con edge neto. Configura API keys en .env (docs/ALPACA_SETUP.md).</div>
  <div id="portfolio"></div>
  <div id="market"></div>
  <div id="list"></div>
  <div class="footer">
    No garantiza rentabilidad. Las recomendaciones consideran costos estimados.
    Ejecución en BTG sigue siendo manual/semi-auto.
  </div>

  <script>
    const money = (n) => Number(n).toLocaleString('es-CL', { maximumFractionDigits: 2 });
    const pct = (n) => `${(Number(n) * 100).toFixed(2)}%`;

    async function runAnalyze() {
      const btn = document.getElementById('runBtn');
      const topN = document.getElementById('topN').value;
      btn.disabled = true;
      document.getElementById('status').className = 'msg';
      document.getElementById('status').textContent = 'Analizando mercado… esto puede tomar unos segundos.';
      document.getElementById('market').innerHTML = '';
      document.getElementById('list').innerHTML = '<div class="loading">Escaneando acciones BCS…</div>';

      try {
        const res = await fetch(`/analyze?top_n=${topN}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error al analizar');

        const m = data.market || {};
        const actionable = (data.actionable || []).length > 0;
        document.getElementById('status').className = 'msg ' + (actionable ? 'ok' : 'warn');
        document.getElementById('status').textContent = data.message || 'Análisis listo';

        document.getElementById('market').innerHTML = `
          <div class="card">
            <div><span class="pill">${m.regime || 'n/a'}</span></div>
            <div class="grid">
              <div class="stat"><div class="k">Score régimen</div><div class="v">${Number(m.regime_score || 0).toFixed(2)}</div></div>
              <div class="stat"><div class="k">Retorno 20d</div><div class="v">${pct(m.benchmark_return_20d || 0)}</div></div>
              <div class="stat"><div class="k">Vol 20d</div><div class="v">${pct(m.benchmark_volatility_20d || 0)}</div></div>
              <div class="stat"><div class="k">Costo round-trip</div><div class="v">${pct((data.cost_model || {}).round_trip_cost_pct || 0)}</div></div>
            </div>
            <ul>${(m.notes || []).map(n => `<li>${n}</li>`).join('')}</ul>
          </div>`;

        const recs = data.recommendations || [];
        if (!recs.length) {
          document.getElementById('list').innerHTML = '<div class="card">Sin resultados.</div>';
          return;
        }

        document.getElementById('list').innerHTML = recs.map(r => {
          const p = r.prediction;
          const plan = r.plan;
          const action = plan.action;
          return `
            <div class="card">
              <div class="row" style="justify-content:space-between;align-items:center">
                <div>
                  <div class="ticker">#${r.rank} ${p.ticker}</div>
                  <div class="meta">${p.name} · ${p.sector}</div>
                </div>
                <span class="pill ${action}">${action}</span>
              </div>
              <div class="grid">
                <div class="stat"><div class="k">Prob. alza</div><div class="v">${pct(p.probability_up)}</div></div>
                <div class="stat"><div class="k">E[r]</div><div class="v">${pct(p.expected_return)}</div></div>
                <div class="stat"><div class="k">Edge neto</div><div class="v">${pct(plan.edge_net_pct)}</div></div>
                <div class="stat"><div class="k">Posición</div><div class="v">${pct(plan.position_pct)}</div></div>
                <div class="stat"><div class="k">Entrada</div><div class="v">${money(plan.entry_price)}</div></div>
                <div class="stat"><div class="k">Stop</div><div class="v">${money(plan.stop_price)}</div></div>
                <div class="stat"><div class="k">Target</div><div class="v">${money(plan.target_price)}</div></div>
                <div class="stat"><div class="k">Horizonte</div><div class="v">${plan.horizon_days}d</div></div>
              </div>
              <ul>${(p.reasons || []).map(x => `<li>+ ${x}</li>`).join('')}</ul>
              <ul>${(p.risks || []).map(x => `<li>! ${x}</li>`).join('')}</ul>
              <div class="meta" style="margin-top:8px">${plan.invalidation || ''}</div>
              ${action === 'buy' ? `<div class="row" style="margin-top:10px">
                <button class="secondary" onclick="decide('${p.ticker}','accepted')">Aceptar</button>
                <button class="secondary" onclick="decide('${p.ticker}','rejected')">Rechazar</button>
              </div>` : ''}
            </div>`;
        }).join('');
      } catch (err) {
        document.getElementById('status').className = 'msg warn';
        document.getElementById('status').textContent = err.message || String(err);
        document.getElementById('list').innerHTML = '';
      } finally {
        btn.disabled = false;
      }
    }

    async function decide(ticker, decision) {
      try {
        const res = await fetch('/decisions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticker, decision, note: 'desde iPhone' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'No se pudo registrar');
        alert(decision === 'accepted' ? 'Registrado + draft BTG creado' : 'Decisión registrada');
      } catch (err) {
        alert(err.message || String(err));
      }
    }

    function renderPortfolio(p) {
      document.getElementById('portfolio').innerHTML = `
        <div class="card">
          <div class="ticker">Portafolio paper</div>
          <div class="grid">
            <div class="stat"><div class="k">Equity</div><div class="v">${money(p.equity)}</div></div>
            <div class="stat"><div class="k">Cash</div><div class="v">${money(p.cash)}</div></div>
            <div class="stat"><div class="k">PnL total</div><div class="v">${money(p.total_pnl)}</div></div>
            <div class="stat"><div class="k">PnL diario</div><div class="v">${money(p.daily_pnl)}</div></div>
            <div class="stat"><div class="k">Posiciones</div><div class="v">${p.open_positions}</div></div>
            <div class="stat"><div class="k">Estado</div><div class="v">${p.halted ? 'DETENIDO' : 'ACTIVO'}</div></div>
          </div>
          ${p.halt_reason ? `<div class="meta">Halt: ${p.halt_reason}</div>` : ''}
        </div>`;
    }

    async function runAutopilot() {
      const btn = document.getElementById('autoBtn');
      const topN = document.getElementById('topN').value;
      btn.disabled = true;
      document.getElementById('status').className = 'msg';
      document.getElementById('status').textContent = 'Autopilot ejecutando ciclo paper…';
      try {
        const res = await fetch(`/autopilot/run?top_n=${topN}&mode=alpaca`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error autopilot');
        document.getElementById('status').className = 'msg ' + ((data.actions || []).some(a => a.ok) ? 'ok' : 'warn');
        document.getElementById('status').textContent = data.message;
        renderPortfolio(data.portfolio);
        await runAnalyze();
      } catch (err) {
        document.getElementById('status').className = 'msg warn';
        document.getElementById('status').textContent = err.message || String(err);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadPortfolio() {
      try {
        const res = await fetch('/portfolio?mode=alpaca');
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Sin portafolio Alpaca');
        renderPortfolio(data);
      } catch (err) {
        document.getElementById('portfolio').innerHTML =
          `<div class="card"><div class="meta">Alpaca no configurado aún: ${err.message || err}. Ver docs/ALPACA_SETUP.md</div></div>`;
      }
    }

    async function haltBot() {
      const res = await fetch('/portfolio/halt?reason=manual_iphone&mode=alpaca', { method: 'POST' });
      renderPortfolio(await res.json());
      document.getElementById('status').className = 'msg warn';
      document.getElementById('status').textContent = 'Kill-switch activado. Autopilot detenido.';
    }

    async function resumeBot() {
      const res = await fetch('/portfolio/resume?mode=alpaca', { method: 'POST' });
      renderPortfolio(await res.json());
      document.getElementById('status').className = 'msg ok';
      document.getElementById('status').textContent = 'Autopilot reanudado.';
    }

    async function liveStatus() {
      const res = await fetch('/live/btg/status');
      const data = await res.json();
      document.getElementById('status').className = 'msg warn';
      document.getElementById('status').textContent =
        `${data.reason} Próximos pasos: ${(data.next_steps || []).join(' → ')}`;
    }

    loadPortfolio();
    liveStatus();
  </script>
</body>
</html>
